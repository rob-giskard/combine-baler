name: build
on:
  push:
    branches: [prototype]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CombineBaler
          path: build/CombineBaler.exe
